# Configurazione OCPP Semplificata V3.9 - AUTEL OCPP v0.12 + DASHBOARD DIAGNOSTICA
# Sostituisce interamente le versioni precedenti.
# Autel MaxiCharger: usa TxProfile raw in W, stackLevel 1.

logger:
  default: warning
  logs:
    ocpp_automation: info

template:
  - sensor:
      - name: "EV Grid Power kW"
        unique_id: ev_grid_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.inverter_grid_power') | float(0) / 1000) | round(2) }}"

      - name: "EV PV Power kW"
        unique_id: ev_pv_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.inverter_pv_power') | float(0) / 1000) | round(2) }}"

      - name: "EV Battery Power kW"
        unique_id: ev_battery_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.inverter_battery_power') | float(0) / 1000) | round(2) }}"

      - name: "EV Wallbox Power kW"
        unique_id: ev_wallbox_power_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >-
          {% set p = states('sensor.charger_power_active_import') | float(0) %}
          {{ (p / 1000 if p > 50 else p) | round(2) }}

      - name: "EV Margine Rete kW"
        unique_id: ev_grid_headroom_kw
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >-
          {% set grid = states('sensor.inverter_grid_power') | float(0) / 1000 %}
          {% set max_grid = states('input_number.ev_max_contatore') | float(6.3) %}
          {% set safety = states('input_number.ev_soglia_sicurezza') | float(0.4) %}
          {{ (max_grid - safety + grid) | round(2) }}

  - trigger:
      - platform: event
        event_type: ev_charging_log
    sensor:
      - name: "EV Charging Log"
        unique_id: ev_charging_log
        state: "{{ trigger.event.data.timestamp | default(now().strftime('%Y-%m-%d %H:%M:%S')) }}"
        attributes:
          entries: >-
            {% set previous = this.attributes.get('entries', []) %}
            {{ ([trigger.event.data.message] + previous)[:30] }}

# ----------------------------------------------------------------------------
# 1. HELPER E CONFIGURAZIONI
# ----------------------------------------------------------------------------
input_number:
  ev_max_contatore:
    name: "Massimo Contatore (kW)"
    initial: 6.3
    min: 1.4
    max: 10.0
    step: 0.1
    unit_of_measurement: kW

  ev_soglia_sicurezza:
    name: "Soglia di Sicurezza (kW)"
    initial: 0.4
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_massima_carica:
    name: "Massima Carica (kW)"
    initial: 6.0
    min: 1.4
    max: 11.0
    step: 0.1
    unit_of_measurement: kW

  ev_minima_batteria_surplus:
    name: "Minima Batteria per Surplus (%)"
    initial: 20
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

  ev_minimo_mantenimento:
    name: "Minimo Mantenimento Batteria (kW)"
    initial: 0.3
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_capacita_wallbox:
    name: "Capacita' Massima Wallbox (kW)"
    initial: 7.0
    min: 1.4
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

  ev_ultima_potenza_inviata:
    name: "Ultima Potenza Inviata (kW)"
    min: 0.0
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

  ev_target_calcolato:
    name: "Target Calcolato EV (kW)"
    min: 0.0
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

input_select:
  ev_modalita:
    name: "Modalità di Ricarica"
    options:
      - "Dinamica"
      - "Fissa"
      - "Surplus"
    initial: "Dinamica"

input_datetime:
  ev_ultimo_invio_dt:
    name: "Data e Ora Ultimo Invio"
    has_date: true
    has_time: true

input_text:
  ev_ultima_modalita_inviata:
    name: "Ultima Modalità Inviata"
    initial: "Nessuna"

input_boolean:
  ev_dry_run_mode:
    name: "Modalità Test (Dry-Run)"
    initial: false

  ev_show_logs:
    name: "Mostra Log EV"
    initial: false

input_button:
  ev_reset_profili:
    name: "Reset Profili OCPP"

timer:
  ev_off_delay:
    name: "Timer Conferma Spegnimento"
    duration: "00:01:30" 

# ----------------------------------------------------------------------------
# 2. AUTOMAZIONI
# ----------------------------------------------------------------------------
automation:
  - alias: "EV - Logica di Ricarica Principale"
    id: ev_logica_principale
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: 
          - sensor.inverter_grid_power
          - sensor.inverter_battery_power
          - sensor.inverter_battery
          - sensor.charger_power_active_import
          - sensor.charger_status_connector
          - sensor.charger_transaction_id
          - sensor.ae0007a1gn5c008960_transaction_id
          - input_select.ev_modalita
          - input_number.ev_max_contatore
          - input_number.ev_soglia_sicurezza
          - input_number.ev_massima_carica
          - input_number.ev_minima_batteria_surplus
          - input_number.ev_minimo_mantenimento
          - input_number.ev_capacita_wallbox
          - input_boolean.ev_dry_run_mode
      - platform: homeassistant
        event: start
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.ev_off_delay
    action:
      - variables:
          # --- RILEVAMENTO GRADO DI SALUTE DELLA RETE (FAIL-SAFE) ---
          grid_state: "{{ states('sensor.inverter_grid_power') }}"
          batt_state: "{{ states('sensor.inverter_battery_power') }}"
          
          # Se i sensori sono sconosciuti o non disponibili, attiviamo la protezione offline
          sensors_offline: "{{ grid_state in ['unavailable', 'unknown', 'none'] or batt_state in ['unavailable', 'unknown', 'none'] }}"

          # --- LETTURE SENSORI (Convertiti in kW) ---
          grid_w: "{{ states('sensor.inverter_grid_power') | float(0) }}"
          grid_kw: "{{ grid_w / 1000 }}" # + Immissione, - Prelievo
          
          # Gestione Batteria: + carica (accumulo), - scarica (erogazione alla casa/auto)
          batt_w: "{{ states('sensor.inverter_battery_power') | float(0) }}"
          batt_kw: "{{ batt_w / 1000 }}" 
          batt_pct: "{{ states('sensor.inverter_battery') | float(0) }}"
          
          raw_ev: "{{ states('sensor.charger_power_active_import') | float(0) }}"
          ev_kw: "{{ raw_ev / 1000 if raw_ev > 50 else raw_ev }}" 
          wb_status: "{{ states('sensor.charger_status_connector') | default(states('sensor.charger_status') | default('Sconosciuto')) }}"

          # Rilevamento automatico e robusto del Transaction ID
          trans_id: >
            {% set t_id = states('sensor.charger_transaction_id') | int(0) %}
            {% if t_id == 0 %}
              {% set t_id = states('sensor.ae0007a1gn5c008960_transaction_id') | int(0) %}
            {% endif %}
            {{ t_id }}

          # --- CONFIGURAZIONI ---
          mode: "{{ states('input_select.ev_modalita') }}"
          max_contatore: "{{ states('input_number.ev_max_contatore') | float(6.3) }}"
          soglia_sic: "{{ states('input_number.ev_soglia_sicurezza') | float(0.4) }}"
          max_carica_user: "{{ states('input_number.ev_massima_carica') | float(6.0) }}"
          min_batt_surplus: "{{ states('input_number.ev_minima_batteria_surplus') | float(20) }}"
          maint_kw: "{{ states('input_number.ev_minimo_mantenimento') | float(0.3) }}"
          max_wallbox: "{{ states('input_number.ev_capacita_wallbox') | float(7.0) }}"
          dry_run: "{{ is_state('input_boolean.ev_dry_run_mode', 'on') }}"
          
          # --- CONTROLLO SCARICA BATTERIA (POLMONE) ---
          batt_drain_kw: "{{ batt_kw if batt_kw | float(0) < 0 else 0.0 }}"

          # --- CALCOLO DISPONIBILITA' ---
          pot_disp: "{{ grid_kw | float(0) + batt_drain_kw | float(0) + ev_kw | float(0) - maint_kw | float(0) }}"

          # --- CALCOLO TARGET TEORICO ---
          target_teorico: >
            {% if sensors_offline | bool(false) %}
              {# PROTEZIONE OFFLINE: Se non leggiamo l'inverter, l'auto va al minimo per evitare blackout #}
              {% if mode == 'Surplus' %} 0.0 {% else %} 1.4 {% endif %}
            {% else %}
              {% set p_disp = pot_disp | float(0) %}
              {% set b_pct = batt_pct | float(0) %}
              {% set m_batt = min_batt_surplus | float(20) %}
              {% if mode == 'Fissa' %} 
                {{ max_carica_user | float(0) }}
              {% elif mode == 'Dinamica' %} 
                {{ (max_contatore | float(0)) - (soglia_sic | float(0)) + (grid_kw | float(0)) + (batt_drain_kw | float(0)) + (ev_kw | float(0)) }}
              {% elif mode == 'Surplus' %}
                {# Surplus puro: carica solo con energia realmente disponibile
                   e solo quando la batteria ha raggiunto la soglia minima. #}
                {% if p_disp >= 1.3 and b_pct >= m_batt %}
                  {{ p_disp }}
                {% else %}
                  0.0
                {% endif %}
              {% else %} 0.0 {% endif %}
            {% endif %}

          temp_target: "{{ [target_teorico | float(0), max_carica_user | float(0), max_wallbox | float(0)] | min }}"
          
          # Logica Spegnimento (Solo Surplus, basata su Rete e stato della Batteria)
          wants_to_stop: >
            {% set t_target = temp_target | float(0) %}
            {% set g_kw = grid_kw | float(0) %}
            {% set b_pct = batt_pct | float(0) %}
            {% if mode == 'Surplus' %}
              {% if t_target < 1.3 %} true {% else %} false {% endif %}
            {% else %} false {% endif %}
          
          last_sent_kw: "{{ states('input_number.ev_ultima_potenza_inviata') | float(0) }}"
          off_delay_expired: "{{ trigger.platform == 'event' and trigger.event.event_type == 'timer.finished' and trigger.event.data.entity_id == 'timer.ev_off_delay' }}"

          # Calcolo Finale
          final_kw: >
            {% set t_target = temp_target | float(0) %}
            {% if mode == 'Surplus' and wants_to_stop | bool(false) %}
              {% if off_delay_expired | bool(false) %} 0.0
              {% else %} 1.4
              {% endif %}
            {% else %}
              {{ [t_target, 1.4] | max | round(1) if t_target >= 1.1 else 0.0 }}
            {% endif %}

          final_amps: "{{ ((final_kw | float(0) * 1000) / 230) | round(1) }}"
          # La Autel dichiara ChargingScheduleAllowedChargingRateUnit=Power.
          # Usiamo quindi direttamente Watt evitando la conversione del Session Current Limit.
          eff_watts: >-
            {% if final_kw | float(0) < 0.5 %}
              230
            {% else %}
              {{ ([final_kw | float(0), 1.4] | max * 1000) | round(0) | int }}
            {% endif %}

          # --- VERIFICA INVIO (SISTEMA BI-DIREZIONALE ANTI-DEADLOCK) ---
          last_sent_ts: "{{ as_timestamp(states('input_datetime.ev_ultimo_invio_dt')) | float(0) }}"
          sec_dal_ultimo: "{{ (as_timestamp(now()) - last_sent_ts) | int }}"
          
          # Calcolo delle differenze con casting numerico esplicito
          diff_sent: "{{ (((final_kw | float(0)) - (last_sent_kw | float(0))) | abs) | round(1) }}"
          diff_real: "{{ (((final_kw | float(0)) - (ev_kw | float(0))) | abs) | round(1) }}"
          
          # Condizioni di variazione significativa (aggiunta forzatura se i sensori vanno offline)
          is_significant: >
            {{ (diff_sent | float(0)) >= 0.4 or 
               (diff_real | float(0)) >= 0.8 or 
               ((final_kw | float(0)) == 0.0 and (ev_kw | float(0)) > 0.5) or 
               ((final_kw | float(0)) >= 1.4 and (ev_kw | float(0)) < 0.5 and (last_sent_kw | float(0)) == 0.0) or
               (sensors_offline | bool(false) and (last_sent_kw | float(0)) > 1.4) }}
               
          is_mode_change: "{{ mode != states('input_text.ev_ultima_modalita_inviata') }}"
          is_safety_reduction: "{{ (final_kw | float(0)) < ((last_sent_kw | float(0)) - 0.1) or (final_kw | float(0)) < ((ev_kw | float(0)) - 0.1) }}"
          
          bypass_delay: "{{ is_safety_reduction | bool(false) or (sensors_offline | bool(false)) }}"
          
          can_send_limit: "{{ (trans_id | int(0)) > 0 }}"
          should_apply: "{{ can_send_limit | bool(false) and (is_significant | bool(false) or is_mode_change | bool(false)) and ((sec_dal_ultimo | int(0)) >= 30 or bypass_delay | bool(false)) }}"

      # Target attuale del controller, aggiornato anche quando il debounce impedisce l'invio
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_target_calcolato
        data:
          value: "{{ final_kw | float(0) }}"

      # Coda diagnostica EV: ultimi 30 eventi, mostrabile dalla dashboard
      - event: ev_charging_log
        event_data:
          timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: >-
            {{ now().strftime('%H:%M:%S') }} | {{ mode }} | {{ wb_status }} |
            Rete {{ grid_kw|round(2) }} kW | Batt {{ batt_pct|round(0) }}% {{ batt_kw|round(2) }} kW |
            EV {{ ev_kw|round(2) }} kW | Target {{ final_kw|round(1) }} kW |
            Richiesto {{ last_sent_kw|round(1) }} kW |
            {{ 'DRY-RUN' if should_apply | bool(false) and dry_run | bool(false) else ('SEND' if should_apply | bool(false) else 'HOLD') }}

      # --- LOGGING COMPLETO AD OGNI TRIGGER (Sempre Visibile) ---
      - service: system_log.write
        data:
          level: "{{ 'warning' if sensors_offline | bool(false) else 'info' }}"
          logger: ocpp_automation
          message: >
            {% if sensors_offline | bool(false) %}
              [EV] !!! SENSORI INVERTER OFFLINE (Internet assente?) !!! Attivata protezione di sicurezza. Modalità: {{ mode }} | Status: {{ wb_status }} | Target forzato a {{ final_kw }}kW ({{ eff_watts }}W). Inviato? {{ 'SI' if should_apply | bool(false) else 'NO' }}
            {% else %}
              [EV] {{ mode }} | Status: {{ wb_status }} | TransID: {{ trans_id }}
              - Rete: {{ grid_kw|round(2) }}kW | Batt: {{ batt_pct }}% ({{ batt_kw|round(2) }}kW) | Auto: {{ ev_kw|round(2) }}kW
              - Disponibile: {{ pot_disp|round(2) }}kW -> Target: {{ final_kw }}kW ({{ eff_watts }}W / {{ final_amps }}A eq.)
              - Inviato? {{ 'DRY-RUN' if should_apply | bool(false) and dry_run | bool(false) else ('SI' if should_apply | bool(false) else 'NO (Attesa 30s o Variazione Minore)') }}
            {% endif %}

      # Gestione Timer (Solo Surplus)
      - if:
          - condition: template
            value_template: "{{ mode == 'Surplus' and wants_to_stop | bool(false) and not off_delay_expired | bool(false) and not is_state('timer.ev_off_delay', 'active') and ((last_sent_kw | float(0)) > 0.5 or (ev_kw | float(0)) > 0.5) }}"
        then:
          - service: timer.start
            target:
              entity_id: timer.ev_off_delay
      - if:
          - condition: template
            value_template: "{{ not wants_to_stop | bool(false) and is_state('timer.ev_off_delay', 'active') }}"
        then:
          - service: timer.cancel
            target:
              entity_id: timer.ev_off_delay

      # Se dobbiamo applicare, eseguiamo l'invio fisico
      - if:
          - condition: template
            value_template: "{{ should_apply | bool(false) }}"
        then:
          - if:
              - condition: template
                value_template: "{{ not dry_run | bool(false) }}"
            then:
              # Autel + OCPP v0.12: il Session Current Limit va in timeout/cambia
              # transazione. Usiamo un TxProfile raw con le capability reali del charger:
              # Power (W) e ChargeProfileMaxStackLevel=1.
              - service: ocpp.set_charge_rate
                data:
                  devid: "AE0007A1GN5C008960"
                  conn_id: 1
                  custom_profile:
                    transactionId: "{{ trans_id | int(0) }}"
                    chargingProfileId: 3101
                    stackLevel: 1
                    chargingProfilePurpose: "TxProfile"
                    chargingProfileKind: "Relative"
                    chargingSchedule:
                      chargingRateUnit: "W"
                      chargingSchedulePeriod: [{startPeriod: 0, limit: "{{ eff_watts | int }}"}]
              - service: input_number.set_value
                target:
                  entity_id: input_number.ev_ultima_potenza_inviata
                data:
                  value: "{{ final_kw | float(0) }}"
              
              - service: input_text.set_value
                target:
                  entity_id: input_text.ev_ultima_modalita_inviata
                data:
                  value: "{{ mode }}"
              
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.ev_ultimo_invio_dt
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - alias: "EV - Reset Profili OCPP"
    trigger:
      - platform: state
        entity_id: input_button.ev_reset_profili
    action:
      - event: ev_charging_log
        event_data:
          timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          message: "{{ now().strftime('%H:%M:%S') }} | RESET | Pulizia profili OCPP richiesta"
      - service: ocpp.clear_profile
        data:
          devid: "AE0007A1GN5C008960"
      - delay: "00:00:05"
