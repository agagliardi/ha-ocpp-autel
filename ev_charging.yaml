# Configurazione OCPP Semplificata V2.4 - Trasparenza Calcolo Surplus
# Sostituisce interamente le versioni precedenti.

logger:
  default: warning
  logs:
    ocpp_automation: info

# ----------------------------------------------------------------------------
# 1. HELPER E CONFIGURAZIONI
# ----------------------------------------------------------------------------
input_number:
  ev_max_contatore:
    name: "Massimo Contatore (kW)"
    initial: 6.3
    min: 1.4
    max: 10.0
    step: 0.1
    unit_of_measurement: kW

  ev_soglia_sicurezza:
    name: "Soglia di Sicurezza (kW)"
    initial: 0.3
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_massima_carica:
    name: "Massima Carica (kW)"
    initial: 6.0
    min: 1.4
    max: 11.0
    step: 0.1
    unit_of_measurement: kW

  ev_minima_batteria_surplus:
    name: "Minima Batteria per Surplus (%)"
    initial: 100
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

  ev_minimo_mantenimento:
    name: "Minimo Mantenimento Batteria (kW)"
    initial: 0.5
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_capacita_wallbox:
    name: "Capacita' Massima Wallbox (kW)"
    initial: 7.0
    min: 1.4
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

  ev_ultima_potenza_inviata:
    name: "Ultima Potenza Inviata (kW)"
    initial: 0.0
    min: 0.0
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

input_select:
  ev_modalita:
    name: "Modalità di Ricarica"
    options:
      - "Dinamica"
      - "Fissa"
      - "Surplus"
    initial: "Dinamica"

input_datetime:
  ev_ultimo_invio_dt:
    name: "Data e Ora Ultimo Invio"
    has_date: true
    has_time: true

input_boolean:
  ev_dry_run_mode:
    name: "Modalità Test (Non inviare)"
    initial: false
  
  ev_startup_delay_active:
    name: "Attesa di Avvio"
    initial: true

input_text:
  ev_ultima_modalita_inviata:
    name: "Ultima Modalità Inviata"
    initial: "Nessuna"

input_button:
  ev_reset_profili:
    name: "Reset Profili OCPP"

# ----------------------------------------------------------------------------
# 2. AUTOMAZIONI
# ----------------------------------------------------------------------------
automation:
  - alias: "EV - Inizializzazione Avvio"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.ev_modalita
        data:
          option: "Dinamica"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_startup_delay_active
      - delay: "00:01:00"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_startup_delay_active

  - alias: "EV - Logica di Ricarica Principale"
    id: ev_logica_principale
    mode: restart 
    trigger:
      - platform: state
        entity_id: 
          - sensor.inverter_grid_power
          - sensor.inverter_battery
          - sensor.charger_power_active_import
          - input_select.ev_modalita
    action:
      - variables:
          # --- LETTURE ---
          grid_w: "{{ states('sensor.inverter_grid_power') | float(0) }}"
          grid_kw: "{{ grid_w / 1000 }}"
          batt_pct: "{{ states('sensor.inverter_battery') | float(0) }}"
          
          # Gestione flessibile: se il sensore è in Watt o già in kW
          raw_ev: "{{ states('sensor.charger_power_active_import') | float(0) }}"
          ev_kw: "{{ raw_ev / 1000 if raw_ev > 50 else raw_ev }}" 
          
          wb_status: "{{ states('sensor.charger_status_connector') | default('Sconosciuto') }}"
          trans_id: "{{ states('sensor.charger_transaction_id') | int(0) }}"

          # --- CONFIG ---
          mode: "{{ states('input_select.ev_modalita') }}"
          max_contatore: "{{ states('input_number.ev_max_contatore') | float(6.3) }}"
          soglia_sic: "{{ states('input_number.ev_soglia_sicurezza') | float(0.3) }}"
          max_carica_user: "{{ states('input_number.ev_massima_carica') | float(6.0) }}"
          min_batt: "{{ states('input_number.ev_minima_batteria_surplus') | float(100) }}"
          maint_kw: "{{ states('input_number.ev_minimo_mantenimento') | float(0.5) }}"
          max_wallbox: "{{ states('input_number.ev_capacita_wallbox') | float(7.0) }}"
          
          # CALCOLO SURPLUS
          # Disponibile = Rete + Consumo Auto - Riserva Batteria
          pot_disp: "{{ grid_kw + ev_kw - maint_kw }}"

          target_calcolato: >
            {% if mode == 'Fissa' %}
              {{ max_carica_user }}
            {% elif mode == 'Dinamica' %}
              {{ max_contatore - soglia_sic + grid_kw + ev_kw }}
            {% elif mode == 'Surplus' %}
              {% if batt_pct < min_batt %} 0.0 {% else %} {{ pot_disp }} {% endif %}
            {% else %} 0.0
            {% endif %}

          # Limiti
          temp_target: "{{ [target_calcolato | float(0), max_carica_user | float(0), max_wallbox | float(0)] | min }}"
          
          final_kw: >
            {% set t = temp_target | float(0) %}
            {% if mode == 'Surplus' %}
              {% if t < 1.3 %}
                {{ 0.0 if grid_kw < -0.2 else ([t, 0.0] | max | round(1)) }}
              {% else %}
                {{ t | round(1) }}
              {% endif %}
            {% else %}
              {{ [t, 1.4] | max | round(1) if t > 0 else 0.0 }}
            {% endif %}
          
          final_amps: "{{ ((final_kw | float(0) * 1000) / 230) | round(1) }}"
          eff_amps: "{{ final_amps | float if (final_amps | float(0)) >= 5.8 else (1.0 if final_kw | float(0) < 0.5 else 6.0) }}"

          # TEMPISTICA
          last_sent_ts: "{{ as_timestamp(states('input_datetime.ev_ultimo_invio_dt')) | float(0) }}"
          sec_dal_ultimo: "{{ (as_timestamp(now()) - last_sent_ts) | int }}"
          wait_time: "{{ 0 if (is_state('input_boolean.ev_startup_delay_active', 'on')) else [ (15 - sec_dal_ultimo), 0 ] | max }}"

          last_sent_kw: "{{ states('input_number.ev_ultima_potenza_inviata') | float(-1) }}"
          is_changed: "{{ (final_kw | float(0) - last_sent_kw | float(0)) | abs >= 0.1 or mode != states('input_text.ev_ultima_modalita_inviata') }}"
          should_apply: "{{ trans_id > 0 and is_changed }}"

      - delay:
          seconds: "{{ wait_time | int(0) }}"

      - service: system_log.write
        data:
          level: info
          logger: ocpp_automation
          message: >
            [EV] {{ mode }} | Rete: {{ grid_kw|round(2) }}kW | Auto: {{ ev_kw|round(2) }}kW | Riserva: {{ maint_kw }}kW
            - Calcolato: {{ pot_disp|round(2) }}kW -> Target: {{ final_kw }}kW ({{ eff_amps }}A)
            - Inviato? {{ 'SI' if should_apply else 'NO' }}

      - if:
          - condition: template
            value_template: "{{ should_apply }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.ev_ultima_potenza_inviata
            data:
              value: "{{ final_kw | float(0) }}"
          - service: input_text.set_value
            target:
              entity_id: input_text.ev_ultima_modalita_inviata
            data:
              value: "{{ mode }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ev_ultimo_invio_dt
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
          - service: ocpp.set_charge_rate
            data:
              conn_id: 1
              custom_profile:
                transactionId: "{{ trans_id | int(0) }}"
                chargingProfileId: 2
                stackLevel: 2
                chargingProfilePurpose: "TxProfile"
                chargingProfileKind: "Relative"
                chargingSchedule:
                  chargingRateUnit: "A"
                  chargingSchedulePeriod: [{startPeriod: 0, limit: "{{ eff_amps | float(1.0) }}"}]

  - alias: "EV - Reset Profili OCPP"
    trigger:
      - platform: state
        entity_id: input_button.ev_reset_profili
    action:
      - service: ocpp.clear_profile
        data:
          device_id: "CH01"
