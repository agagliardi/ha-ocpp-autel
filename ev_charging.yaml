# Configurazione OCPP Semplificata V1.9 - Fix Reset su Riconnessione e Log Avanzati
# Sostituisce interamente le versioni precedenti.

logger:
  default: warning
  logs:
    ocpp_automation: info

# ----------------------------------------------------------------------------
# 1. HELPER E CONFIGURAZIONI
# ----------------------------------------------------------------------------
input_number:
  ev_max_contatore:
    name: "Massimo Contatore (kW)"
    initial: 6.3
    min: 1.4
    max: 10.0
    step: 0.1
    unit_of_measurement: kW

  ev_soglia_sicurezza:
    name: "Soglia di Sicurezza (kW)"
    initial: 0.3
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_massima_carica:
    name: "Massima Carica (kW)"
    initial: 6.0
    min: 1.4
    max: 11.0
    step: 0.1
    unit_of_measurement: kW

  ev_minima_batteria_surplus:
    name: "Minima Batteria per Surplus (%)"
    initial: 100
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

  ev_minimo_mantenimento:
    name: "Minimo Mantenimento Batteria (kW)"
    initial: 0.5
    min: 0.0
    max: 2.0
    step: 0.1
    unit_of_measurement: kW

  ev_capacita_wallbox:
    name: "Capacita' Massima Wallbox (kW)"
    initial: 7.0
    min: 1.4
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

  ev_ultima_potenza_inviata:
    name: "Ultima Potenza Inviata (kW)"
    initial: 0.0
    min: 0.0
    max: 22.0
    step: 0.1
    unit_of_measurement: kW

input_select:
  ev_modalita:
    name: "Modalità di Ricarica"
    options:
      - "Dinamica"
      - "Fissa"
      - "Surplus"
    initial: "Dinamica"

input_datetime:
  ev_ultimo_invio_dt:
    name: "Data e Ora Ultimo Invio"
    has_date: true
    has_time: true

input_boolean:
  ev_dry_run_mode:
    name: "Modalità Test (Non inviare)"
    initial: false
  
  ev_startup_delay_active:
    name: "Attesa di Avvio"
    initial: true

input_text:
  ev_ultima_modalita_inviata:
    name: "Ultima Modalità Inviata"
    initial: "Nessuna"

input_button:
  ev_reset_profili:
    name: "Reset Profili OCPP"

# ----------------------------------------------------------------------------
# 2. AUTOMAZIONI
# ----------------------------------------------------------------------------
automation:
  - alias: "EV - Inizializzazione Avvio"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.ev_modalita
        data:
          option: "Dinamica"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_startup_delay_active
      - delay: "00:01:00"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_startup_delay_active

  - alias: "EV - Logica di Ricarica Principale"
    id: ev_logica_principale
    mode: restart 
    trigger:
      - platform: state
        entity_id: 
          - sensor.inverter_grid_power
          - sensor.inverter_battery
          - sensor.charger_power_active_import
          - input_select.ev_modalita
          - input_number.ev_massima_carica
          - input_number.ev_max_contatore
          - input_number.ev_minima_batteria_surplus
      - platform: state
        entity_id: sensor.charger_transaction_id # RESET: Scatta quando l'auto viene collegata/avviata
    action:
      - variables:
          grid_w: "{{ states('sensor.inverter_grid_power') | float(0) }}"
          grid_kw: "{{ grid_w / 1000 }}"
          batt_pct: "{{ states('sensor.inverter_battery') | float(0) }}"
          ev_w: "{{ states('sensor.charger_power_active_import') | float(0) }}"
          ev_kw: "{{ ev_w / 1000 }}"
          
          # Stato fisico della wallbox per il log (Aggiornato con il nome corretto)
          wb_status: "{{ states('sensor.charger_status_connector') | default('Sconosciuto') }}"

          mode: "{{ states('input_select.ev_modalita') }}"
          max_contatore: "{{ states('input_number.ev_max_contatore') | float(6.3) }}"
          soglia_sic: "{{ states('input_number.ev_soglia_sicurezza') | float(0.3) }}"
          max_carica_user: "{{ states('input_number.ev_massima_carica') | float(6.0) }}"
          min_batt: "{{ states('input_number.ev_minima_batteria_surplus') | float(100) }}"
          maint_kw: "{{ states('input_number.ev_minimo_mantenimento') | float(0.5) }}"
          max_wallbox: "{{ states('input_number.ev_capacita_wallbox') | float(7.0) }}"
          
          trans_id: "{{ states('sensor.charger_transaction_id') | int(0) }}"
          limite_dinamico: "{{ max_contatore - soglia_sic }}"

          # Flag per capire se è appena iniziata una ricarica
          is_new_transaction: "{{ trigger.entity_id == 'sensor.charger_transaction_id' and trigger.from_state.state | int(0) == 0 and trans_id > 0 }}"

          reason: >
            {% if mode == 'Surplus' %}
              {% if grid_kw < 0 %} Prelievo Rete
              {% elif batt_pct < min_batt %} Batteria Bassa ({{batt_pct}}% < {{min_batt}}%)
              {% else %} OK
              {% endif %}
            {% else %} OK
            {% endif %}

          target_calcolato: >
            {% if mode == 'Fissa' %}
              {{ max_carica_user }}
            {% elif mode == 'Dinamica' %}
              {{ limite_dinamico + grid_kw + ev_kw }}
            {% elif mode == 'Surplus' %}
              {% if grid_kw < 0 or batt_pct < min_batt %}
                0.0
              {% else %}
                {{ grid_kw + ev_kw - maint_kw }}
              {% endif %}
            {% else %}
              0.0
            {% endif %}

          target_limitato_user: "{{ [target_calcolato | float(0), max_carica_user | float(0)] | min }}"
          target_limitato_hw: "{{ [target_limitato_user | float(0), max_wallbox | float(0)] | min }}"
          final_kw: "{{ [target_limitato_hw | float(0), 0.0] | max | round(1) }}"
          
          final_amps: "{{ ((final_kw * 1000) / 230) | round(1) }}"
          eff_amps: "{{ final_amps if final_amps >= 5.8 else 1.0 }}"

          is_startup: "{{ is_state('input_boolean.ev_startup_delay_active', 'on') }}"
          last_sent_ts: "{{ as_timestamp(states('input_datetime.ev_ultimo_invio_dt')) | float(0) }}"
          sec_dal_ultimo: "{{ (as_timestamp(now()) - last_sent_ts) | int }}"
          attesa_normale: "{{ [ (15 - sec_dal_ultimo), 0 ] | max }}"
          
          # Se è una nuova transazione, annulliamo l'attesa per resettare subito la wallbox
          wait_time: "{{ 0 if (is_startup or is_new_transaction) else attesa_normale }}"

          last_sent_kw: "{{ states('input_number.ev_ultima_potenza_inviata') | float(-1) }}"
          last_mode: "{{ states('input_text.ev_ultima_modalita_inviata') }}"
          
          # FORZATURA: Invia se potenza/modo sono cambiati OPPURE se è una nuova connessione
          is_changed: "{{ final_kw != last_sent_kw or mode != last_mode or last_sent_kw == -1 or is_new_transaction }}"
          
          should_apply: "{{ trans_id > 0 and is_changed }}"

      - delay:
          seconds: "{{ wait_time }}"

      - service: system_log.write
        data:
          level: info
          logger: ocpp_automation
          message: >
            [EV] Modo: {{ mode }} | WB Status: {{ wb_status }} | Rete: {{ grid_w }}W | Auto: {{ ev_w }}W
            - Target: {{ final_kw }}kW ({{ eff_amps }}A) | Ultimo Invio: {{ last_sent_kw }}kW
            - Inviato? {{ 'SI (Nuova Transazione)' if is_new_transaction else ('SI' if should_apply else 'NO') }}

      - if:
          - condition: template
            value_template: "{{ should_apply }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.ev_ultima_potenza_inviata
            data:
              value: "{{ final_kw }}"
          
          - service: input_text.set_value
            target:
              entity_id: input_text.ev_ultima_modalita_inviata
            data:
              value: "{{ mode }}"

          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ev_ultimo_invio_dt
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
          - if:
              - condition: template
                value_template: "{{ not is_state('input_boolean.ev_dry_run_mode', 'on') }}"
            then:
              - service: ocpp.set_charge_rate
                data:
                  conn_id: 1
                  custom_profile:
                    transactionId: "{{ trans_id }}"
                    chargingProfileId: 2
                    stackLevel: 2
                    chargingProfilePurpose: "TxProfile"
                    chargingProfileKind: "Relative"
                    chargingSchedule:
                      chargingRateUnit: "A"
                      chargingSchedulePeriod: [{startPeriod: 0, limit: "{{ eff_amps }}"}]

  - alias: "EV - Reset Profili OCPP"
    trigger:
      - platform: state
        entity_id: input_button.ev_reset_profili
    action:
      - service: ocpp.clear_profile
        data:
          device_id: "CH01"
