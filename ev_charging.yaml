# Configurazione Unificata OCPP con Modulazione Dinamica e Modalità Solare
# Ottimizzazione: Gestione soglia minima per ricarica solare e riduzione fluttuazioni

logger:
  default: warning
  logs:
    ocpp_automation: info
    homeassistant.components.system_log: info

template:
  - sensor:
      - name: "Consumo Casa Reale"
        unique_id: house_consumption_real
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set pv_w = states('sensor.inverter_pv_power') | float(0) %}
          {% set grid_w = states('sensor.inverter_grid_power') | float(0) %}
          {% set battery_w = states('sensor.inverter_battery_power') | float(0) %}
          {% set ev_kw = states('sensor.charger_power_active_import') | float(0) %}
          
          {% set import_w = grid_w * -1 if grid_w < 0 else 0 %}
          {% set battery_discharge_w = battery_w * -1 if battery_w < 0 else 0 %}
          {% set battery_charge_w = battery_w if battery_w > 0 else 0 %}
          
          {% set total_supply_kw = (pv_w + import_w + battery_discharge_w) / 1000 %}
          {% set house_kw = total_supply_kw - (battery_charge_w / 1000) - ev_kw %}
          {{ [house_kw, 0.0] | max | round(2) }}

input_number:
  ev_charging_power_kw:
    name: "Potenza di Ricarica Target (kW)"
    initial: 3.7
    min: 1.4
    max: 6
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:gauge

  ev_max_power_config_kw:
    name: "Limite Massimo Contatore (kW)"
    initial: 6
    min: 1.4
    max: 6.6
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:shield-check

  ev_dynamic_buffer_kw:
    name: "Buffer di Sicurezza (kW)"
    initial: 0.4
    min: 0
    max: 2
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:safety-goggles

  ev_last_sent_watt:
    name: "Ultima Potenza Inviata (W)"
    initial: -1
    min: -1
    max: 7400
    step: 1
    mode: slider
    unit_of_measurement: W
    icon: mdi:transmit

input_boolean:
  ev_dynamic_balancing_enabled:
    name: "Modulazione Carico Dinamica"
    initial: true
    icon: mdi:scale-balance

  ev_solar_only_mode:
    name: "Modalità Solo Surplus Fotovoltaico"
    initial: false
    icon: mdi:solar-power

automation:
  - alias: "EV - Modulazione Dinamica TxProfile"
    id: ev_modulate_tx_profile
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.inverter_grid_power
        for: "00:00:30" # Aumentata la finestra di osservazione per stabilità
      - platform: state
        entity_id: sensor.inverter_pv_power
        for: "00:00:30"
      - platform: state
        entity_id: input_boolean.ev_solar_only_mode
    condition:
      - condition: state
        entity_id: input_boolean.ev_dynamic_balancing_enabled
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.charger_transaction_id') | int(0) > 0 or 
             states('sensor.charger_status_connector') in ['Charging', 'SuspendedEVSE', 'Occupied'] }}
    action:
      - variables:
          solar_mode: "{{ is_state('input_boolean.ev_solar_only_mode', 'on') }}"
          pv_w: "{{ states('sensor.inverter_pv_power') | float(0) }}"
          grid_w: "{{ states('sensor.inverter_grid_power') | float(0) }}"
          battery_w: "{{ states('sensor.inverter_battery_power') | float(0) }}"
          ev_kw: "{{ states('sensor.charger_power_active_import') | float(0) }}"
          
          import_w: "{{ grid_w * -1 if grid_w < 0 else 0 }}"
          battery_dis_w: "{{ battery_w * -1 if battery_w < 0 else 0 }}"
          battery_ch_w: "{{ battery_w if battery_w > 0 else 0 }}"
          
          house_w: "{{ (pv_w + import_w + battery_dis_w) - battery_ch_w - (ev_kw * 1000) }}"
          house_kw: "{{ [house_w / 1000, 0.0] | max }}"

          actual_surplus_kw: "{{ [(pv_w / 1000) - house_kw, 0.0] | max }}"

          max_limit_kw: "{{ states('input_number.ev_max_power_config_kw') | float(6.0) }}"
          buffer_kw: "{{ states('input_number.ev_dynamic_buffer_kw') | float(0.4) }}"
          available_balancing_kw: "{{ max_limit_kw - house_kw - buffer_kw }}"

          target_user_kw: "{{ states('input_number.ev_charging_power_kw') | float(3.7) }}"
          last_sent_watt: "{{ states('input_number.ev_last_sent_watt') | float(-1) }}"

          final_kw: >
            {% if solar_mode %}
              {{ [actual_surplus_kw, target_user_kw] | min }}
            {% else %}
              {{ [available_balancing_kw, target_user_kw] | min }}
            {% endif %}

          new_watt: "{{ (final_kw * 1000) | round(0) }}"
          new_amps: "{{ (new_watt / 230) | round(1) }}"
          
          # MODIFICA SOGLIA: Se siamo tra 4.5A e 6A, forziamo 6A (circa 1.1kW - 1.4kW)
          # Questo permette di usare il solare anche se manca un soffio alla soglia minima
          effective_amps: >
            {% if new_amps >= 5.8 %} {{ [new_amps, 32.0] | min }}
            {% elif new_amps >= 4.5 and solar_mode %} 6.0
            {% else %} 1.0
            {% endif %}
          
          # ISTERESI: Aumentata a 500W per ridurre ulteriormente i comandi
          significant_change: "{{ (last_sent_watt - new_watt) | abs >= 500 }}"
          is_mode_switch: "{{ trigger.entity_id == 'input_boolean.ev_solar_only_mode' }}"

      - if:
          - condition: template
            value_template: "{{ is_mode_switch or significant_change or last_sent_watt == -1 }}"
        then:
          - delay: "00:00:02"
          
          - service: system_log.write
            data:
              level: info
              logger: ocpp_automation
              message: >
                [EV Stability] Modo: {{ 'SOLARE' if solar_mode else 'NORMALE' }}.
                Surplus: {{ actual_surplus_kw | round(2) }}kW. Azione: {{ effective_amps }}A.
                (Delta: {{ (last_sent_watt - new_watt) | abs | round(0) }}W)

          - if:
              - condition: template
                value_template: "{{ not is_state('input_boolean.ev_dry_run_mode', 'on') }}"
            then:
              - service: ocpp.set_charge_rate
                data:
                  conn_id: 1
                  custom_profile:
                    transactionId: "{{ states('sensor.charger_transaction_id') | int(0) }}"
                    chargingProfileId: 2
                    stackLevel: 2
                    chargingProfilePurpose: "TxProfile"
                    chargingProfileKind: "Relative"
                    chargingSchedule:
                      chargingRateUnit: "A"
                      chargingSchedulePeriod:
                        - startPeriod: 0
                          limit: "{{ effective_amps | round(1) }}"
          
          - service: input_number.set_value
            target:
              entity_id: input_number.ev_last_sent_watt
            data:
              value: "{{ new_watt }}"

  - alias: "EV - Reset Profili OCPP"
    id: ev_reset_ocpp_profiles
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.ev_reset_ocpp_profiles
    action:
      - service: ocpp.clear_profile
        data:
          dev_id: "charger"
      - delay: "00:00:05"
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_last_sent_watt
        data:
          value: -1

