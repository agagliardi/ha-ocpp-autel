# Configurazione Unificata OCPP con Modulazione Dinamica e Modalità Solare
# Identificativo wallbox: "charger" (dev_id)

logger:
  default: warning
  logs:
    ocpp_automation: info
    homeassistant.components.system_log: info

template:
  - sensor:
      - name: "Consumo Casa Senza Auto"
        unique_id: house_consumption_no_ev
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set grid_w = states('sensor.inverter_grid_power') | float(0) %}
          {# Valore negativo = prelievo, quindi lo invertiamo per avere il valore di import positivo #}
          {% set net_import_kw = (grid_w * -1) / 1000 if grid_w < 0 else 0 %}
          {% set ev_kw = states('sensor.charger_power_active_import') | float(0) %}
          {% set house_kw = net_import_kw - ev_kw %}
          {{ [house_kw, 0.0] | max | round(2) }}

      - name: "Stato Wallbox Parlante"
        unique_id: wallbox_friendly_status
        icon: >
          {% set s = states('sensor.charger_status_connector') %}
          {% if s == 'Charging' %} mdi:ev-station
          {% elif s in ['Occupied', 'Preparing'] %} mdi:car-connected
          {% elif s == 'Available' %} mdi:ev-plug-type2
          {% elif s == 'SuspendedEVSE' %} mdi:pause-circle
          {% elif s == 'SuspendedEV' %} mdi:car-brake-parking
          {% else %} mdi:alert-circle
          {% endif %}
        state: >
          {% set s = states('sensor.charger_status_connector') %}
          {% if s == 'Available' %} Libera
          {% elif s == 'Preparing' %} Inizializzazione
          {% elif s == 'Charging' %} In Carica
          {% elif s == 'SuspendedEV' %} Sospesa dall'Auto (Batteria Carica)
          {% elif s == 'SuspendedEVSE' %} In Pausa (Gestione Carichi / Sole Insufficiente)
          {% elif s == 'Finishing' %} Fine Sessione
          {% elif s == 'Occupied' %} Cavo Collegato
          {% elif s == 'Faulted' %} Errore Wallbox
          {% else %} 
            {% if is_state('sensor.charger_status_connector', 'unavailable') %} Disconnessa {% else %} {{ s }} {% endif %}
          {% endif %}

input_number:
  ev_charging_power_kw:
    name: "Potenza di Ricarica Target (kW)"
    initial: 3.7
    min: 1.4
    max: 6
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:gauge

  ev_max_power_config_kw:
    name: "Limite Massimo Contatore (kW)"
    initial: 6
    min: 1.4
    max: 6.6
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:shield-check

  ev_dynamic_buffer_kw:
    name: "Buffer di Sicurezza (kW)"
    initial: 0.3
    min: 0
    max: 2
    step: 0.1
    mode: box
    unit_of_measurement: kW
    icon: mdi:safety-goggles

  ev_last_sent_watt:
    name: "Ultima Potenza Inviata (W)"
    initial: -1
    min: -1
    max: 7400
    step: 1
    mode: slider
    unit_of_measurement: W
    icon: mdi:transmit

input_boolean:
  ev_dynamic_balancing_enabled:
    name: "Modulazione Carico Dinamica"
    initial: true
    icon: mdi:scale-balance

  ev_solar_only_mode:
    name: "Modalità Solo Surplus Fotovoltaico"
    initial: false
    icon: mdi:solar-power

  ev_dry_run_mode:
    name: "Modalità Test (Dry-Run)"
    initial: false
    icon: mdi:test-tube

input_button:
  ev_reset_ocpp_profiles:
    name: "Reset Profili OCPP"
    icon: mdi:refresh

automation:
  # --- INIZIALIZZAZIONE ALL'AVVIO ---
  - alias: "EV - Inizializzazione all'Avvio"
    id: ev_startup_init
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:15"
      - service: system_log.write
        data:
          level: info
          logger: ocpp_automation
          message: "[EV Init] Avvio sistema. Richiesto allineamento stato wallbox."
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_last_sent_watt
        data:
          value: -1

  # --- AUTOMAZIONE 1: TARGET UTENTE (STACK 1) ---
  - alias: "EV - Imposta Target TxDefaultProfile"
    id: ev_set_target_default_profile
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.ev_charging_power_kw
    action:
      - delay: "00:00:05" 
      - variables:
          target_kw: "{{ states('input_number.ev_charging_power_kw') | float(0) }}"
          target_w: "{{ (target_kw * 1000) | round(0) }}"
          target_amps: "{{ (target_w / 230) | round(1) }}"
          dry_run: "{{ is_state('input_boolean.ev_dry_run_mode', 'on') }}"
      - service: system_log.write
        data:
          level: info
          logger: ocpp_automation
          message: "[EV Target] Nuovo Limite Base: {{ target_kw }}kW ({{ target_amps }}A)."
      - if:
          - condition: template
            value_template: "{{ not dry_run }}"
        then:
          - service: ocpp.set_charge_rate
            data:
              conn_id: 1
              custom_profile:
                chargingProfileId: 1
                stackLevel: 1
                chargingProfilePurpose: "TxDefaultProfile"
                chargingProfileKind: "Relative"
                chargingSchedule:
                  chargingRateUnit: "A"
                  chargingSchedulePeriod:
                    - startPeriod: 0
                      limit: "{{ target_amps if target_amps >= 6 else 1 }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_last_sent_watt
        data:
          value: -1 

  # --- AUTOMAZIONE 2: BILANCIAMENTO DINAMICO E MODALITA' SOLARE (STACK 2) ---
  - alias: "EV - Modulazione Dinamica TxProfile"
    id: ev_modulate_tx_profile
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.inverter_grid_power
        for: "00:00:10" 
      - platform: state
        entity_id: sensor.inverter_battery
      - platform: state
        entity_id: input_boolean.ev_solar_only_mode
      - platform: time_pattern
        minutes: "/2" 
    condition:
      - condition: state
        entity_id: input_boolean.ev_dynamic_balancing_enabled
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.charger_transaction_id') | int(0) > 0 or 
             states('sensor.charger_status_connector') in ['Charging', 'SuspendedEVSE', 'Occupied'] }}
    action:
      - variables:
          dry_run: "{{ is_state('input_boolean.ev_dry_run_mode', 'on') }}"
          solar_mode: "{{ is_state('input_boolean.ev_solar_only_mode', 'on') }}"
          
          grid_w: "{{ states('sensor.inverter_grid_power') | float(0) }}"
          ev_kw: "{{ states('sensor.charger_power_active_import') | float(0) }}"
          battery_soc: "{{ states('sensor.inverter_battery') | float(0) }}"
          
          export_kw: "{{ [grid_w / 1000, 0.0] | max }}"
          import_kw: "{{ [(grid_w * -1) / 1000, 0.0] | max }}"
          house_only_kw: "{{ [import_kw - ev_kw, 0.0] | max }}"

          max_limit_kw: "{{ states('input_number.ev_max_power_config_kw') | float(6.0) }}"
          target_user_kw: "{{ states('input_number.ev_charging_power_kw') | float(3.7) }}"
          buffer_kw: "{{ states('input_number.ev_dynamic_buffer_kw') | float(0.3) }}"
          last_sent_watt: "{{ states('input_number.ev_last_sent_watt') | float(0) }}"
          last_amps: "{{ (last_sent_watt / 230) | round(1) }}"

          total_surplus_kw: "{{ export_kw + ev_kw }}"
          available_balancing_kw: "{{ max_limit_kw - house_only_kw - buffer_kw }}"

          # LOGICA DECISIONALE
          final_kw: >
            {% if solar_mode %}
              {% if battery_soc < 80 %} 0.0
              {% else %} {{ [total_surplus_kw, target_user_kw] | min }}
              {% endif %}
            {% else %}
              {{ [ [available_balancing_kw, target_user_kw] | min, 0 ] | max }}
            {% endif %}

          new_watt: "{{ (final_kw * 1000) | round(0) }}"
          new_amps: "{{ (new_watt / 230) | round(1) }}"
          effective_amps: "{{ new_amps if new_amps >= 6 else (1 if new_amps < 5.5 else 6) }}"
          
          # Isteresi ridotta a 200W per superare il blocco dei 4kW
          significant_change: "{{ (last_sent_watt - new_watt) | abs >= 200 }}"
          value_changed: "{{ effective_amps != last_amps }}"
          should_run: "{{ (value_changed and significant_change) or trigger.platform == 'time_pattern' or trigger.entity_id == 'input_boolean.ev_solar_only_mode' or last_sent_watt == -1 }}"

      - if:
          - condition: template
            value_template: "{{ should_run }}"
        then:
          - service: system_log.write
            data:
              level: info
              logger: ocpp_automation
              message: >
                [EV Core] Modo: {{ 'SOLARE' if solar_mode else 'NORMALE' }}.
                Disp: {{ available_balancing_kw | round(2) }}kW, Target: {{ target_user_kw }}kW.
                Azione: {{ effective_amps }}A. (Causa: {{ 'Bilanciamento' if available_balancing_kw < target_user_kw else 'Target Utente' }}).

          - if:
              - condition: template
                value_template: "{{ not dry_run }}"
            then:
              - service: ocpp.set_charge_rate
                data:
                  conn_id: 1
                  custom_profile:
                    transactionId: "{{ states('sensor.charger_transaction_id') | int(0) }}"
                    chargingProfileId: 2
                    stackLevel: 2
                    chargingProfilePurpose: "TxProfile"
                    chargingProfileKind: "Relative"
                    chargingSchedule:
                      chargingRateUnit: "A"
                      chargingSchedulePeriod:
                        - startPeriod: 0
                          limit: "{{ effective_amps }}"
          
          - service: input_number.set_value
            target:
              entity_id: input_number.ev_last_sent_watt
            data:
              value: "{{ new_watt }}"

  # --- AUTOMAZIONE 4: RESET PROFILI ---
  - alias: "EV - Reset Profili OCPP"
    id: ev_reset_ocpp_profiles
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.ev_reset_ocpp_profiles
    action:
      - service: system_log.write
        data:
          level: warning
          logger: ocpp_automation
          message: "[EV Reset] Pulizia profili OCPP reale richiesta."
      - service: ocpp.clear_profile
        data:
          dev_id: "charger"
      - delay: "00:00:05"
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_last_sent_watt
        data:
          value: -1
      - variables:
          target_kw: "{{ states('input_number.ev_charging_power_kw') | float(3.7) }}"
          target_amps: "{{ ((target_kw * 1000) / 230) | round(1) }}"
      - service: ocpp.set_charge_rate
        data:
          conn_id: 1
          custom_profile:
            chargingProfileId: 1
            stackLevel: 1
            chargingProfilePurpose: "TxDefaultProfile"
            chargingProfileKind: "Relative"
            chargingSchedule:
              chargingRateUnit: "A"
              chargingSchedulePeriod:
                - startPeriod: 0
                  limit: "{{ target_amps if target_amps >= 6 else 1 }}"
